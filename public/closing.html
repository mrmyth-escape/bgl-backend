<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>打烊結帳 — 勃根地密室</title>
<style>
  :root{
    --purple:#552583; --purple-dk:#3C1A5E; --purple-lt:#7B4BA8; --purple-pale:#F1ECF7;
    --gold:#FDB927;   --gold-dk:#C98A0B;   --gold-pale:#FFF6E0;
    --bg:#F5F4F8; --card:#FFFFFF; --line:#E2DEEA; --ink:#1E1728; --dim:#6B6478;
    --ok:#0F7B3E; --ok-bg:#E8F5ED; --bad:#C62828; --bad-bg:#FDECEC;
    --shadow:0 1px 2px rgba(30,23,40,.06), 0 4px 12px rgba(30,23,40,.05);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif;
       padding-bottom:108px}

  /* ---------- 頁首 ---------- */
  header{position:sticky;top:0;z-index:30;background:var(--purple);color:#fff;
         border-bottom:3px solid var(--gold);box-shadow:var(--shadow)}
  .hwrap{max-width:1120px;margin:0 auto;padding:11px 20px;
         display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{font-size:17px;font-weight:700;letter-spacing:.6px;white-space:nowrap}
  .brand em{color:var(--gold);font-style:normal}
  .hfield{display:flex;align-items:center;gap:7px;font-size:13px}
  .hfield label{color:#D9CEE8;white-space:nowrap;margin:0}
  header select{background:rgba(255,255,255,.13);color:#fff;border:1px solid rgba(255,255,255,.3);
                border-radius:7px;padding:6px 9px;font:inherit;font-size:14px;width:auto}
  header select option{color:#1E1728}
  .hspace{flex:1}
  .pill{background:var(--gold);color:#3C1A5E;border-radius:20px;padding:3px 11px;
        font-size:12px;font-weight:700;white-space:nowrap}
  .pill.grey{background:rgba(255,255,255,.18);color:#fff}
  .iconbtn{background:rgba(255,255,255,.13);color:#fff;border:1px solid rgba(255,255,255,.3);
           border-radius:7px;width:30px;height:30px;font-size:17px;line-height:1;cursor:pointer;padding:0}
  .iconbtn:hover{background:rgba(255,255,255,.25)}

  /* ---------- 版面：左收入 右收款，跟紙本一樣 ---------- */
  main{max-width:1120px;margin:0 auto;padding:18px 20px}
  .cols{display:grid;grid-template-columns:1fr;gap:16px}
  @media(min-width:900px){ .cols{grid-template-columns:1fr 1fr;align-items:start} }

  section{background:var(--card);border:1px solid var(--line);border-radius:12px;
          padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow)}
  section > h2{margin:0 0 12px;font-size:13px;font-weight:700;color:var(--purple);
               letter-spacing:1.4px;display:flex;align-items:center;gap:9px}
  section > h2::after{content:"";flex:1;height:2px;background:var(--purple-pale);border-radius:2px}

  label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px;font-weight:500}
  input,select,textarea{width:100%;background:#fff;color:var(--ink);border:1.5px solid var(--line);
        border-radius:8px;padding:9px 11px;font:inherit;transition:border-color .12s}
  input:hover,select:hover{border-color:#C9C2D6}
  input:focus,select:focus{outline:none;border-color:var(--purple);
        box-shadow:0 0 0 3px rgba(85,37,131,.13)}
  input[type=number]{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:16px}
  input:disabled,select:disabled{background:#F4F3F6;color:#9A93A6;cursor:not-allowed}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row > *{flex:1;min-width:0}

  button{background:var(--purple);color:#fff;border:0;border-radius:8px;padding:11px 18px;
         font:600 15px/1 inherit;cursor:pointer;white-space:nowrap;transition:background .12s}
  button:hover{background:var(--purple-dk)}
  button.ghost{background:#fff;color:var(--purple);border:1.5px solid var(--line)}
  button.ghost:hover{background:var(--purple-pale);border-color:var(--purple-lt)}
  button.gold{background:var(--gold);color:#3C1A5E}
  button.gold:hover{background:var(--gold-dk);color:#fff}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.tiny{padding:7px 11px;font-size:13px}

  /* 表格式輸入列：名稱 + 金額，跟紙本一樣一行一項 */
  .r{display:grid;grid-template-columns:1fr 148px;gap:10px;align-items:center;
     padding:5px 0;border-bottom:1px solid #F0EDF5}
  .r:last-of-type{border-bottom:0}
  .r > .nm{font-size:15px;font-weight:500}
  .r.cash > .nm::after{content:"　現金";font-size:11px;color:var(--gold-dk);font-weight:600}
  .r3{grid-template-columns:1fr 148px 34px}

  .sum{display:flex;justify-content:space-between;align-items:baseline;
       margin:10px -18px -16px;padding:12px 18px;border-radius:0 0 8px 8px;
       background:var(--purple-pale);font-variant-numeric:tabular-nums}
  .sum span{color:var(--purple);font-weight:600;font-size:14px}
  .sum b{font-size:21px;color:var(--purple-dk)}
  .mini{display:flex;justify-content:space-between;padding:7px 0;font-size:14px;
        font-variant-numeric:tabular-nums;border-bottom:1px dashed var(--line)}
  .mini:last-child{border-bottom:0}
  .mini span{color:var(--dim)}
  .mini b{font-weight:700}

  .cash-grid{display:grid;grid-template-columns:58px 1fr 92px;gap:8px;align-items:center;margin-bottom:6px}
  .cash-grid > .den{font-size:14px;color:var(--dim);text-align:right;font-weight:600}
  .cash-grid > .sub{font-size:13px;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}

  .ok{color:var(--ok)} .bad{color:var(--bad)} .dim{color:var(--dim)}
  .hint{font-size:12px;color:var(--dim);margin-top:8px;line-height:1.55}

  /* ---------- 底部總結列 ---------- */
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;
       border-top:3px solid var(--gold);box-shadow:0 -3px 16px rgba(30,23,40,.1);
       padding:10px 20px calc(10px + env(safe-area-inset-bottom))}
  .bwrap{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:13px;flex-wrap:wrap}
  .stat{display:flex;flex-direction:column;min-width:84px}
  .stat .k{font-size:11px;color:var(--dim);letter-spacing:.4px}
  .stat .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
  .stat.big .v{font-size:26px}
  .op{font-size:19px;color:var(--dim);font-weight:300;align-self:center;padding-top:12px}
  .bsep{width:1px;height:34px;background:var(--line)}
  .bar button{padding:13px 26px;font-size:16px}
  @media(max-width:640px){
    .stat .v{font-size:17px} .stat.big .v{font-size:20px}
    .stat{min-width:62px} .op{font-size:15px;padding-top:11px}
    .bar button{flex:1;width:100%}
  }

  /* ---------- 提示 ---------- */
  .note{border-radius:10px;padding:11px 14px;margin-bottom:16px;font-size:14px;line-height:1.6}
  .note.warn{background:var(--gold-pale);border:1.5px solid var(--gold)}
  .note.lock{background:var(--purple-pale);border:1.5px solid var(--purple-lt);color:var(--purple-dk)}
  .note b{display:block;margin-bottom:2px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:112px;z-index:50;
         max-width:min(600px,92vw);padding:13px 17px;border-radius:10px;font-size:14px;
         white-space:pre-line;display:none;box-shadow:0 6px 24px rgba(30,23,40,.22);line-height:1.6}
  .toast.show{display:block}
  .toast.e{background:var(--bad-bg);border:1.5px solid var(--bad);color:#7F1D1D}
  .toast.s{background:var(--ok-bg);border:1.5px solid var(--ok);color:#14532D}

  #setup{max-width:430px;margin:56px auto}
  #setup h2::after{display:none}
  .center{text-align:center}
</style>
</head>
<body>

<header>
  <div class="hwrap">
    <div class="brand">勃根地密室 <em>／</em> 打烊結帳</div>
    <div class="hfield"><label for="date">日期</label><select id="date"></select></div>
    <div class="hfield">
      <label for="staff">經手人</label>
      <select id="staff"><option value="">請選擇</option></select>
      <button class="iconbtn" id="addStaffBtn" title="新增人員">＋</button>
    </div>
    <div class="hspace"></div>
    <span class="pill grey" id="statusPill">載入中</span>
  </div>
</header>

<section id="setup" style="display:none">
  <h2>首次設定</h2>
  <div class="center hint" style="margin:0 0 14px">
    這台電腦只需要設定一次，之後打開就直接進入結帳畫面。
  </div>
  <label for="apikey">店內密碼</label>
  <input type="password" id="apikey" placeholder="向老闆索取" autocomplete="off">
  <button style="width:100%;margin-top:12px" onclick="saveKey()">開始使用</button>
</section>

<main id="app" style="display:none">
  <div id="notes"></div>

  <div class="cols">
    <!-- ============ 左：收入 ============ -->
    <div>
      <section>
        <h2>收入</h2>
        <div id="revenues"></div>
        <div class="sum"><span>小計</span><b id="gross">0</b></div>
      </section>

      <section>
        <h2>折扣</h2>
        <div class="r"><span class="nm">折扣金額</span>
          <input type="number" min="0" step="1" id="discount" placeholder="0"></div>
        <div class="sum"><span>應收（小計 － 折扣）</span><b id="net">0</b></div>
      </section>

      <section>
        <h2>支出</h2>
        <div id="expenses"></div>
        <button class="ghost tiny" style="width:100%;margin-top:6px" onclick="addExpense()">＋ 新增支出</button>
        <div class="mini" style="margin-top:8px"><span>支出合計</span><b id="expenseTotal">0</b></div>
      </section>
    </div>

    <!-- ============ 右：收款 ============ -->
    <div>
      <section>
        <h2>收款方式</h2>
        <div id="payments"></div>
        <div class="sum"><span>總計</span><b id="actual">0</b></div>
      </section>

      <section>
        <h2>現金點鈔<span style="font-size:11px;color:var(--dim);letter-spacing:0;font-weight:400">（選填）</span></h2>
        <button class="ghost tiny" id="cashToggle" style="width:100%" onclick="toggleCash()">展開點鈔</button>
        <div id="cashBox" style="display:none;margin-top:12px">
          <label for="openingFloat">開店零用金</label>
          <input type="number" id="openingFloat" value="0" step="1" min="0">
          <div style="height:12px"></div>
          <div id="cash"></div>
          <div class="mini"><span>點鈔合計</span><b id="counted">0</b></div>
          <div class="mini"><span>櫃內應有</span><b id="expectedCash">0</b></div>
          <div class="mini"><span>現金差額</span><b id="cashVar" class="ok">0</b></div>
          <div class="hint">櫃內應有 ＝ 零用金 ＋ 現金收款 － 以現金支付的支出</div>
        </div>
      </section>
    </div>
  </div>

  <section>
    <h2>送出</h2>
    <div class="row">
      <div><label for="varianceReason">差額原因（帳不平時必填）</label>
        <input id="varianceReason" placeholder="例：客人多付未找零、刷卡機重複刷"></div>
      <div><label for="notes2">備註</label>
        <input id="notes2" placeholder="公休、特殊狀況…"></div>
    </div>
    <label id="forceWrap" style="display:none;align-items:center;gap:8px;margin-top:12px;
           color:var(--bad);font-weight:600;font-size:14px;cursor:pointer">
      <input type="checkbox" id="force" style="width:auto"> 帳款有差額，我已確認並仍要送出
    </label>
    <div class="row" style="margin-top:14px">
      <button class="ghost" onclick="save()">暫存草稿</button>
      <button class="gold" onclick="submit()" id="submitBtn">送出結帳</button>
    </div>
  </section>

  <div class="center" style="padding:0 0 20px">
    <button class="ghost tiny" onclick="forgetKey()">清除本機設定</button>
  </div>
</main>

<div class="bar" id="bar" style="display:none">
  <div class="bwrap">
    <div class="stat"><span class="k">收入</span><span class="v" id="bGross">0</span></div>
    <div class="op">−</div>
    <div class="stat"><span class="k">折扣</span><span class="v" id="bDiscount">0</span></div>
    <div class="op">＝</div>
    <div class="stat"><span class="k">應收</span><span class="v" id="bNet">0</span></div>
    <div class="bsep"></div>
    <div class="stat"><span class="k">收款總計</span><span class="v" id="bActual">0</span></div>
    <div class="bsep"></div>
    <div class="stat big"><span class="k">差額</span><span class="v ok" id="bVar">0</span></div>
    <div style="flex:1"></div>
    <button class="gold" onclick="submit()">送出結帳</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const KEY = 'bgl_key', STORE = 'dazhong';
let META = null, STATE = null;

const nf  = (n) => (n ?? 0).toLocaleString('zh-TW');
const num = (v) => { const n = Math.round(Number(v)); return Number.isFinite(n) ? n : 0; };

function toast(msg, kind = 's') {
  const t = $('toast');
  t.textContent = msg;
  t.className = `toast show ${kind}`;
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), kind === 'e' ? 9000 : 4000);
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { 'Content-Type': 'application/json',
               'X-Api-Key': localStorage.getItem(KEY) || '', ...(opts.headers || {}) },
  });
  const data = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
  if (!res.ok) {
    if (res.status === 401) { localStorage.removeItem(KEY); showSetup(); }
    const detail = data.blockers ? '\n\n・' + data.blockers.join('\n・') : '';
    const hint   = data.hint ? `\n\n${data.hint}` : '';
    throw new Error((data.error || `HTTP ${res.status}`) + detail + hint);
  }
  return data;
}

// ---------- 設定 ----------
function showSetup() {
  $('setup').style.display = 'block';
  $('app').style.display = 'none';
  $('bar').style.display = 'none';
  $('statusPill').textContent = '未設定';
}
function saveKey() {
  const k = $('apikey').value.trim();
  if (!k) return toast('請輸入店內密碼', 'e');
  localStorage.setItem(KEY, k);
  $('setup').style.display = 'none';
  load();
}
function forgetKey() {
  if (!confirm('清除後這台電腦下次要重新輸入店內密碼，確定嗎？')) return;
  localStorage.removeItem(KEY);
  location.reload();
}

// ---------- 載入 ----------
async function load() {
  try {
    const data = await api(`/api/closing/preview?date=${$('date').value}&store=${STORE}`);
    META  = data.meta;
    STATE = data.closing;
    $('setup').style.display = 'none';
    $('app').style.display = 'block';
    $('bar').style.display = 'block';
    renderStaff();
    render(data);
  } catch (e) { toast('載入失敗：' + e.message, 'e'); }
}

const statusLabel = (s) => ({ new: '尚未建立', draft: '草稿', locked: '已結帳' }[s] || s);

function render(data) {
  const locked = STATE.status === 'locked';

  const notes = [];
  if (locked) {
    notes.push(`<div class="note lock"><b>此日已結帳完成</b>
      ${new Date(STATE.submittedAt).toLocaleString('zh-TW')}　經手人：${STATE.submittedBy || '—'}
      　內容已鎖定，需請老闆解鎖才能修改。</div>`);
  }
  const pending = (data?.pendingClosings || []).filter((d) => d !== $('date').value);
  if (pending.length) {
    notes.push(`<div class="note warn"><b>這幾天還沒結帳</b>${pending.join('、')}
      　請確認是否公休，或切換日期補結。</div>`);
  }
  $('notes').innerHTML = notes.join('');

  $('statusPill').textContent = statusLabel(STATE.status);
  $('statusPill').className = 'pill' + (locked ? '' : ' grey');

  renderRevenues();
  renderPayments();
  renderExpenses();
  renderCash();

  $('discount').value       = STATE.discountTotal || '';
  $('openingFloat').value   = STATE.openingFloat ?? 0;
  $('varianceReason').value = STATE.varianceReason || '';
  $('notes2').value         = STATE.notes || '';
  if (STATE.staffId) $('staff').value = STATE.staffId;

  // 有點鈔資料就自動展開
  if (Object.keys(STATE.cashCounts || {}).length) toggleCash(true);

  document.querySelectorAll('#app input, #app select').forEach((el) => { el.disabled = locked; });
  $('staff').disabled = locked;
  $('submitBtn').disabled = locked;

  recalc();
}

function renderStaff() {
  const cur = $('staff').value;
  $('staff').innerHTML = '<option value="">請選擇</option>' +
    (META.staff || []).map((s) => `<option value="${s.id}">${s.name}</option>`).join('');
  if (cur) $('staff').value = cur;
  const last = localStorage.getItem('bgl_last_staff');
  if (!$('staff').value && last) $('staff').value = last;
}

async function addStaff() {
  const name = prompt('新增經手人，請輸入姓名：');
  if (!name || !name.trim()) return;
  try {
    const r = await api('/api/staff', {
      method: 'POST', body: JSON.stringify({ name: name.trim(), storeCode: STORE }),
    });
    META.staff = [...(META.staff || []).filter((s) => s.id !== r.staff.id), r.staff]
      .sort((a, b) => a.name.localeCompare(b.name, 'zh-Hant'));
    renderStaff();
    $('staff').value = r.staff.id;
    toast(r.message);
  } catch (e) { toast('新增失敗：' + e.message, 'e'); }
}

// ---------- 收入 / 收款 ----------
function renderRevenues() {
  const by = Object.fromEntries((STATE.revenues || []).map((r) => [r.itemId, r.amount]));
  $('revenues').innerHTML = META.revenueItems.map((it) => `
    <div class="r">
      <span class="nm">${it.name}</span>
      <input type="number" min="0" step="1" placeholder="0" data-rv="${it.id}" value="${by[it.id] || ''}">
    </div>`).join('') || '<div class="dim">尚未設定收入項目，請到老闆頁的設定新增。</div>';
  $('revenues').oninput = recalc;
}

function renderPayments() {
  const by = Object.fromEntries((STATE.payments || []).map((p) => [p.methodId, p]));
  $('payments').innerHTML = META.paymentMethods.map((m) => `
    <div class="r ${m.isCash ? 'cash' : ''}">
      <span class="nm">${m.name}</span>
      <input type="number" min="0" step="1" placeholder="0" data-pm="${m.id}" value="${by[m.id]?.amount || ''}">
    </div>`).join('') || '<div class="dim">尚未設定收款方式，請到老闆頁的設定新增。</div>';
  $('payments').oninput = recalc;
}

function renderExpenses() {
  $('expenses').innerHTML = (STATE.expenses || []).map((e, i) => {
    const opts = META.expenseCategories
      .map((c) => `<option value="${c.key}" ${e.category === c.key ? 'selected' : ''}>${c.label}</option>`).join('');
    return `<div class="r r3" style="grid-template-columns:118px 1fr 128px 34px">
      <select data-e="${i}" data-f="category">${opts}</select>
      <input placeholder="說明" data-e="${i}" data-f="note" value="${e.note || ''}">
      <input type="number" min="0" step="1" placeholder="金額" data-e="${i}" data-f="amount" value="${e.amount || ''}">
      <button class="ghost tiny" onclick="delExpense(${i})" title="刪除">✕</button>
    </div>
    <div class="r" style="grid-template-columns:118px 1fr;border-bottom:1px solid #F0EDF5;padding-bottom:8px">
      <span></span>
      <select data-e="${i}" data-f="paidBy">
        <option value="cash" ${e.paidBy !== 'card' ? 'selected' : ''}>現金支付（從錢櫃扣）</option>
        <option value="card" ${e.paidBy === 'card' ? 'selected' : ''}>非現金支付</option>
      </select>
    </div>`;
  }).join('') || '<div class="dim" style="padding:4px 0">今天沒有支出</div>';
  $('expenses').oninput = recalc;
}

function addExpense() {
  STATE.expenses = STATE.expenses || [];
  STATE.expenses.push({ category: 'supplies', amount: 0, paidBy: 'cash', note: '' });
  renderExpenses();
}
function delExpense(i) { STATE.expenses.splice(i, 1); renderExpenses(); recalc(); }

function toggleCash(force) {
  const box = $('cashBox');
  const open = force === true ? true : box.style.display === 'none';
  box.style.display = open ? 'block' : 'none';
  $('cashToggle').textContent = open ? '收起點鈔' : '展開點鈔';
}

function renderCash() {
  $('cash').innerHTML = META.denominations.map((d) => `
    <div class="cash-grid">
      <span class="den">${nf(d)}</span>
      <input type="number" min="0" step="1" placeholder="張／枚" data-d="${d}" value="${STATE.cashCounts?.[d] || ''}">
      <span class="sub" id="cd${d}">0</span>
    </div>`).join('');
  $('cash').oninput = recalc;
}

// ---------- 收集 ＋ 試算 ----------
function collect() {
  const revenues = [...document.querySelectorAll('#revenues [data-rv]')].map((el) => {
    const it = META.revenueItems.find((x) => String(x.id) === el.dataset.rv);
    return { itemId: it.id, itemName: it.name, amount: num(el.value) };
  });

  const payments = [...document.querySelectorAll('#payments [data-pm]')].map((el) => {
    const m = META.paymentMethods.find((x) => String(x.id) === el.dataset.pm);
    return { methodId: m.id, methodName: m.name, isCash: m.isCash, amount: num(el.value) };
  });

  const expenses = (STATE.expenses || []).map((_, i) => ({
    category: document.querySelector(`[data-e="${i}"][data-f=category]`)?.value || 'other',
    amount:   num(document.querySelector(`[data-e="${i}"][data-f=amount]`)?.value),
    paidBy:   document.querySelector(`[data-e="${i}"][data-f=paidBy]`)?.value || 'cash',
    note:     document.querySelector(`[data-e="${i}"][data-f=note]`)?.value || null,
  }));

  const cashCounts = {};
  document.querySelectorAll('#cash [data-d]').forEach((el) => {
    const q = num(el.value);
    if (q > 0) cashCounts[el.dataset.d] = q;
  });

  const staffId = $('staff').value ? Number($('staff').value) : null;
  const staffName = staffId ? (META.staff.find((s) => s.id === staffId)?.name ?? null) : null;

  return {
    storeCode: STORE, businessDate: $('date').value,
    revenues, payments, expenses, cashCounts,
    discountTotal: num($('discount').value),
    openingFloat:  num($('openingFloat').value),
    varianceReason: $('varianceReason').value.trim() || null,
    notes: $('notes2').value.trim() || null,
    staffId, submittedBy: staffName,
    forceSubmit: $('force').checked,
  };
}

function recalc() {
  const d = collect();

  const gross    = d.revenues.reduce((s, r) => s + r.amount, 0);
  const net      = gross - d.discountTotal;
  const actual   = d.payments.reduce((s, p) => s + p.amount, 0);
  const expTotal = d.expenses.reduce((s, e) => s + e.amount, 0);

  const cashIn  = d.payments.filter((p) => p.isCash).reduce((s, p) => s + p.amount, 0);
  const cashOut = d.expenses.filter((e) => e.paidBy === 'cash').reduce((s, e) => s + e.amount, 0);
  const expectedCash = d.openingFloat + cashIn - cashOut;

  let counted = 0;
  META.denominations.forEach((den) => {
    const q = d.cashCounts[den] || 0;
    counted += den * q;
    const cell = $(`cd${den}`);
    if (cell) cell.textContent = nf(den * q);
  });

  const variance = actual - net;
  const cashVar  = counted - expectedCash;

  $('gross').textContent        = nf(gross);
  $('net').textContent          = nf(net);
  $('actual').textContent       = nf(actual);
  $('expenseTotal').textContent = nf(expTotal);
  $('counted').textContent      = nf(counted);
  $('expectedCash').textContent = nf(expectedCash);
  signed($('cashVar'), counted === 0 ? 0 : cashVar);

  $('bGross').textContent    = nf(gross);
  $('bDiscount').textContent = nf(d.discountTotal);
  $('bNet').textContent      = nf(net);
  $('bActual').textContent   = nf(actual);
  signed($('bVar'), variance);

  const needReason = variance !== 0 || (counted > 0 && cashVar !== 0);
  $('forceWrap').style.display = needReason ? 'flex' : 'none';
}

function signed(el, v) {
  el.textContent = (v > 0 ? '+' : '') + nf(v);
  el.className = el.className.replace(/\b(ok|bad)\b/g, '').trim() + (v === 0 ? ' ok' : ' bad');
}

// ---------- 送出 ----------
async function save() {
  try {
    const data = await api('/api/closing', { method: 'POST', body: JSON.stringify(collect()) });
    STATE = data.closing;
    render();
    toast('草稿已暫存');
  } catch (e) { toast('暫存失敗：' + e.message, 'e'); }
}

async function submit() {
  if (!$('staff').value) return toast('請先在上方選擇經手人', 'e');
  if (!confirm('確定送出結帳？送出後會鎖定，需請老闆解鎖才能修改。')) return;
  try {
    const data = await api('/api/closing/submit', { method: 'POST', body: JSON.stringify(collect()) });
    STATE = data.closing;
    localStorage.setItem('bgl_last_staff', $('staff').value);
    render();
    const warn = data.warnings?.length ? '\n\n請留意：\n・' + data.warnings.join('\n・') : '';
    toast(data.message + warn);
  } catch (e) { toast(e.message, 'e'); }
}

// ---------- 啟動 ----------
(function init() {
  const taipei = (d) => new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
  const base  = new Date(Date.now() - 6 * 3600 * 1000);   // 凌晨結帳算前一天
  const today = taipei(base);
  const yest  = taipei(new Date(base.getTime() - 86400000));
  $('date').innerHTML = `<option value="${today}">${today}（今天）</option>
                         <option value="${yest}">${yest}（昨天）</option>`;

  $('date').addEventListener('change', load);
  $('discount').addEventListener('input', recalc);
  $('openingFloat').addEventListener('input', recalc);
  $('addStaffBtn').addEventListener('click', addStaff);
  $('apikey').addEventListener('keydown', (e) => { if (e.key === 'Enter') saveKey(); });

  if (localStorage.getItem(KEY)) load();
  else showSetup();
})();
</script>
