<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>勃根地密室 — 結帳系統</title>
<style>
  :root{
    --purple:#552583; --purple-dk:#3C1A5E; --purple-lt:#7B4BA8;
    --gold:#FDB927; --bg:#F5F4F8; --line:#E2DEEA; --ink:#1E1728; --dim:#6B6478;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
       display:flex;align-items:center;justify-content:center;padding:24px;
       font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif}
  .box{max-width:420px;width:100%}
  .crest{background:linear-gradient(150deg,var(--purple),var(--purple-dk));
         border-bottom:4px solid var(--gold);border-radius:14px 14px 0 0;
         padding:26px 24px 22px;color:#fff;box-shadow:0 4px 18px rgba(60,26,94,.22)}
  h1{font-size:23px;margin:0;letter-spacing:2px;font-weight:700}
  .sub{color:var(--gold);font-size:13px;letter-spacing:3px;margin-top:5px;text-transform:uppercase}
  .menu{background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;
        padding:10px;box-shadow:0 4px 18px rgba(30,23,40,.07)}
  a{display:flex;align-items:center;gap:14px;padding:15px 14px;border-radius:10px;
    color:var(--ink);text-decoration:none;transition:background .12s}
  a:hover{background:#F4F1F9}
  a + a{border-top:1px solid var(--line)}
  .ico{width:38px;height:38px;flex:0 0 38px;border-radius:9px;background:var(--purple);color:var(--gold);
       display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700}
  .txt b{display:block;font-size:16px;color:var(--purple-dk)}
  .txt span{font-size:13px;color:var(--dim)}
  .arw{margin-left:auto;color:var(--purple-lt);font-size:19px}
</style>
</head>
<body>
  <div class="box">
    <div class="crest">
      <h1>勃根地密室</h1>
      <div class="sub">Checkout System</div>
    </div>
    <div class="menu">
      <a href="/closing.html">
        <span class="ico">結</span>
        <span class="txt"><b>打烊結帳</b><span>核對當日帳款、點鈔、送出日結</span></span>
        <span class="arw">›</span>
      </a>
      <a href="/report.html">
        <span class="ico">報</span>
        <span class="txt"><b>營運報表</b><span>月結、房間表現、趨勢、系統設定</span></span>
        <span class="arw">›</span>
      </a>
      <a href="/api/health">
        <span class="ico">✓</span>
        <span class="txt"><b>系統健檢</b><span>確認資料庫連線狀態</span></span>
        <span class="arw">›</span>
      </a>
    </div>
  </div>
</body>
</html>
